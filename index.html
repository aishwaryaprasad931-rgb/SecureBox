
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBox | Password Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🔐 SecureBox</h1>
        <p>Your passwords, organized in one place.</p>
    </header>

    <main class="container">

        <section class="stats">
            <div class="stat-card">
                <h3 id="totalCount">0</h3>
                <p>Saved Accounts</p>
            </div>
            <div class="stat-card">
                <h3>🔒</h3>
                <p>Your Digital Vault</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add New Account</h2>

            <form id="passwordForm">
                <input type="text" id="website"
                    placeholder="Website name (e.g. Google)" required>

                <input type="text" id="username"
                    placeholder="Username / Email" required>

                <div class="password-input">
                    <input type="password" id="password"
                        placeholder="Password" required>
                    <button type="button" id="toggleInput">Show</button>
                </div>

                <div class="strength">
                    <div id="strengthBar"></div>
                </div>
                <p id="strengthText">Password strength</p>

                <div class="generator">
                    <button type="button" id="generateBtn">
                        Generate Strong Password
                    </button>
                </div>

                <button type="submit" class="add-btn">
                    + Save Password
                </button>
            </form>
        </section>

        <section class="accounts-section">
            <h2>Saved Accounts</h2>

            <input type="search" id="search"
                placeholder="Search accounts...">

            <div id="accountList"></div>
        </section>

    </main>

    <footer>
        <p>SecureBox © 2026 | Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
